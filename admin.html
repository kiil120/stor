<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="img/logo.svg" type="image/svg+xml">
<title>لوحة تحكم دفيّ</title>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#24406B;--p2:#16294A;--a:#E8758F;--a2:#FCE6EB;--bg:#F5F8FC;--sf:#E7EEF9;--t:#1B2433;--m:#69758A;--ln:#E1E8F1;--ok:#2E9E6B}
*{box-sizing:border-box;margin:0}body{font-family:'Readex Pro',Tahoma,sans-serif;background:var(--bg);color:var(--t);line-height:1.6}
button{font:inherit;cursor:pointer;border:0;color:inherit}
input,select,textarea{font:inherit;width:100%;padding:9px 12px;border:1.5px solid var(--ln);border-radius:10px;background:#fff}
:focus-visible{outline:3px solid var(--a);outline-offset:2px}
.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
header{background:var(--p2);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
header b{font-size:18px}.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:rgba(255,255,255,.1);color:#fff;padding:7px 16px;border-radius:99px}.nav .on{background:var(--a)}
main{max-width:1100px;margin:auto;padding:16px}
.b{background:var(--p);color:#fff;padding:9px 18px;border-radius:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.b.s{background:var(--sf);color:var(--p)}.b.r{background:var(--a2);color:#B23A55}.b.g{background:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
.stats div{background:#fff;border-radius:16px;padding:14px;border:1px solid var(--ln)}.stats b{font-size:24px;color:var(--p);display:block}.stats span{color:var(--m);font-size:13px}
.bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.card{background:#fff;border:1px solid var(--ln);border-radius:16px;padding:14px;margin-bottom:10px}
.pl{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.pl img,.ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--sf);display:block;margin-bottom:8px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:16px;overflow:hidden;font-size:14px}
th,td{padding:10px;text-align:right;border-bottom:1px solid var(--ln);vertical-align:top}th{background:var(--sf);color:var(--p)}
.tw{overflow-x:auto;border-radius:16px;border:1px solid var(--ln)}
.mod{position:fixed;inset:0;background:rgba(22,41,74,.5);display:none;place-items:start center;overflow:auto;padding:16px;z-index:10}.mod.on{display:grid}
.mod>div{background:#fff;border-radius:20px;padding:18px;width:min(760px,100%)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:13px;color:var(--m);display:block;margin:8px 0 3px}
.cr{border:1.5px solid var(--ln);border-radius:14px;padding:12px;margin:10px 0}
.cr .top{display:grid;grid-template-columns:1fr 54px auto;gap:8px;align-items:end}.cr input[type=color]{padding:2px;height:40px}
.im{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.im div{position:relative}.im img{width:64px;height:64px;border-radius:10px;object-fit:cover}
.im button{position:absolute;top:-6px;left:-6px;background:var(--a);color:#fff;border-radius:99px;width:20px;height:20px;font-size:12px;line-height:1}
.stk{display:flex;gap:8px;flex-wrap:wrap}.stk div{width:78px}.stk label{margin:0;text-align:center}
.st{background:var(--a2);padding:1px 10px;border-radius:99px;font-size:12px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--p2);color:#fff;padding:10px 20px;border-radius:99px;display:none;z-index:99}
@media(max-width:600px){.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><b style="display:flex;gap:8px;align-items:center"><img src="img/logo.svg" width="30" height="30" alt="" style="border-radius:8px">لوحة تحكم دفيّ</b><div class="nav" id="nav"></div><span id="sy" style="font-size:12px;opacity:.8"></span></header>
<main id="main"></main>
<div class="mod" id="mod"><div id="mb"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STS=['جديد','قيد التجهيز','في الطريق','تم التسليم','ملغي'];
/* ===== قاعدة البيانات المحلية IndexedDB ===== */
const DB=new Promise((res,rej)=>{const r=indexedDB.open('dafi',2);r.onupgradeneeded=()=>['products','orders','settings','users'].forEach(s=>{if(!r.result.objectStoreNames.contains(s))r.result.createObjectStore(s,{keyPath:'id'})});r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(s,m),o=f(t.objectStore(s));t.oncomplete=()=>res(o.result);t.onerror=()=>rej(t.error)})};
const all=s=>tx(s,'readonly',o=>o.getAll()),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,id)=>tx(s,'readwrite',o=>o.delete(id));
let T='orders',PR=[],OR=[],US=[],CF={id:'cfg',api:'https://script.google.com/macros/s/AKfycbyJ8nO_Y-KGj_ht5Yh46vqm41DLzkPPl0Exutn4l3vsvOEouL7sCCcPacq9dvJ69ATQ/exec',key:'',cloud:'',preset:'',wa:'201000000000'},ed=null;
async function init(){
 try{await navigator.storage?.persist?.()}catch(e){}
 PR=await all('products');OR=(await all('orders')).sort((a,b)=>b.id.localeCompare(a.id));US=await all('users');
 CF={...CF,...((await all('settings')).find(x=>x.id==='cfg')||{})};
 nav();render();if(CF.api){sync();setInterval(sync,60000)}}
function nav(){$('nav').innerHTML=[['orders','الطلبات'],['products','المنتجات'],['customers','العملاء'],['users','المستخدمون'],['settings','الإعدادات']].map(([k,v])=>`<button class="${T===k?'on':''}" onclick="T='${k}';nav();render()">${v}</button>`).join('')}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._);t._=setTimeout(()=>t.style.display='none',2600)}
async function api(action,d={}){
 if(!CF.api)return{ok:false,error:'ضع رابط Apps Script في الإعدادات'};
 try{const t=await(await fetch(CF.api,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action,key:CF.key,...d})})).text();
  try{return JSON.parse(t)}catch(e){return{ok:false,error:'الرد ليس من الخادم: تأكد أن الوصول Anyone وأن الرابط ينتهي بـ /exec'}}}
 catch(e){return{ok:false,error:'تعذّر الوصول للخادم: تحقق من الرابط ومن نشر الويب Anyone'}}}
async function ping(){
 if(!CF.api)return toast('اكتب الرابط أولاً');
 try{const r=JSON.parse(await(await fetch(CF.api+'?action=products')).text());toast(r.ok?'الاتصال سليم ✓ ('+r.products.length+' منتج منشور)':'الخادم رد بخطأ')}
 catch(e){toast('فشل الاتصال: الرابط خطأ أو النشر ليس Anyone')}
 if(CF.key){const r=await api('adminPull');toast(r.ok?'مفتاح الأدمن صحيح ✓':r.error)}}
function render(){({orders:rOrders,products:rProducts,customers:rCust,users:rUsers,settings:rSet})[T]()}

/* ===== الطلبات ===== */
function rOrders(){
 const rev=OR.filter(o=>o.status!=='ملغي').reduce((s,o)=>s+o.total,0);
 $('main').innerHTML=`<div class="stats"><div><b>${OR.length}</b><span>كل الطلبات</span></div><div><b>${OR.filter(o=>o.status==='جديد').length}</b><span>طلبات جديدة</span></div><div><b>${rev}</b><span>إجمالي المبيعات (ج)</span></div><div><b>${new Set(OR.map(o=>o.phone)).size}</b><span>عدد العملاء</span></div></div>
 <div class="bar"><button class="b" onclick="sync(true)">سحب الطلبات الجديدة</button><button class="b s" onclick="backup()">نسخة احتياطية</button><label class="b s" style="margin:0;color:var(--p)">استعادة<input type="file" accept=".json" hidden onchange="restore(this)"></label></div>
 <div class="tw"><table><tr><th>رقم</th><th>العميل</th><th>المنتجات</th><th>الإجمالي</th><th>الحالة</th><th></th></tr>${OR.map(o=>`<tr><td>${esc(o.id)}<br><small>${esc(String(o.date||'').slice(0,10))}</small></td><td>${esc(o.name)}<br><small>${esc(o.phone)} · ${esc(o.gov)}<br>${esc(o.address)}</small></td>
 <td>${o.items.map(i=>`${esc(i.name)} (${esc(i.color||'')} / ${esc(i.size||'')}) ×${i.qty}`).join('<br>')}</td><td>${o.total} ج</td>
 <td><select onchange="setSt('${o.id}',this.value)">${STS.map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}</select></td>
 <td><a class="b s" target="_blank" href="https://wa.me/2${esc(o.phone)}?text=${encodeURIComponent('مرحباً '+o.name+'، بخصوص طلبك رقم '+o.id)}">واتساب</a></td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--m);padding:30px">لا توجد طلبات بعد. اضغط "سحب الطلبات الجديدة".</td></tr>'}</table></div>`}
async function setSt(id,s){const o=OR.find(x=>x.id===id);o.status=s;await put('orders',o);api('adminStatus',{id,status:s});toast('تم تحديث الحالة')}
async function sync(manual){
 const r=await api('adminPull');if(!r.ok){if(manual)toast(r.error);return}
 let n=0;for(const x of r.orders){if(OR.find(o=>o.id===x.id))continue;
  const items=JSON.parse(x.items);
  items.forEach(i=>{const p=PR.find(p=>p.id==i.id),c=p&&p.colors.find(c=>c.name===i.color),k=p&&p.sizes.indexOf(i.size);if(c&&k>-1)c.stock[k]=Math.max(0,c.stock[k]-i.qty)});
  const o={id:x.id,date:x.date,name:x.name,phone:String(x.phone),gov:x.gov,address:x.address,notes:x.notes,items,total:x.total,source:x.source,status:'جديد'};
  await put('orders',o);OR.unshift(o);n++}
 for(const p of PR)await put('products',p);
 for(const u of r.users||[]){const x={id:u.phone,name:u.name,phone:u.phone,created:u.created};await put('users',x);const i=US.findIndex(k=>k.id===x.id);i>-1?US[i]=x:US.push(x)}
 if(T==='users')rUsers();
 if(r.orders.length)await api('adminAck',{ids:r.orders.map(o=>o.id)});
 $('sy').textContent='آخر مزامنة '+new Date().toLocaleTimeString('ar-EG');
 if(n){toast(n+' طلب جديد');if(T==='orders')rOrders()}else if(manual)toast('لا توجد طلبات جديدة')}

/* ===== المستخدمون (حسابات المتجر) ===== */
function rUsers(){
 $('main').innerHTML=`<div class="bar"><button class="b" onclick="sync(true)">تحديث القائمة</button><span style="color:var(--m);font-size:13px">${US.length} حساب مسجّل</span></div>
 <div class="tw"><table><tr><th>الاسم</th><th>الهاتف</th><th>تاريخ التسجيل</th><th>الطلبات</th><th></th></tr>${US.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.phone)}</td><td>${esc(String(u.created||'').slice(0,10))}</td><td>${OR.filter(o=>o.phone===u.phone).length}</td>
 <td><div class="bar" style="margin:0"><button class="b s" onclick="resetPw('${esc(u.phone)}')">إعادة تعيين كلمة السر</button><a class="b s" target="_blank" href="https://wa.me/2${esc(u.phone)}">واتساب</a></div></td></tr>`).join('')||'<tr><td colspan="5" style="text-align:center;padding:30px;color:var(--m)">لا توجد حسابات بعد.</td></tr>'}</table></div>`}
async function resetPw(phone){const n=prompt('كلمة السر الجديدة (6 أحرف على الأقل)');if(!n||n.length<6)return;const r=await api('adminResetPass',{phone,newPass:n});toast(r.ok?'تم التعيين، أرسلها للعميل':'فشل: '+(r.error||'المستخدم غير موجود'))}

/* ===== العملاء ===== */
function rCust(){
 const m={};OR.forEach(o=>{const c=m[o.phone]||(m[o.phone]={name:o.name,phone:o.phone,n:0,sum:0,last:o.date});c.n++;c.sum+=o.status==='ملغي'?0:o.total});
 $('main').innerHTML=`<div class="tw"><table><tr><th>الاسم</th><th>الهاتف</th><th>الطلبات</th><th>إجمالي الشراء</th></tr>${Object.values(m).sort((a,b)=>b.sum-a.sum).map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${c.n}</td><td>${c.sum} ج</td></tr>`).join('')||'<tr><td colspan="4" style="text-align:center;padding:30px;color:var(--m)">لا يوجد عملاء بعد.</td></tr>'}</table></div>`}

/* ===== المنتجات ===== */
const tot=p=>p.colors.reduce((s,c)=>s+c.stock.reduce((a,b)=>a+(+b||0),0),0);
function rProducts(){
 $('main').innerHTML=`<div class="bar"><button class="b" onclick="edit()">+ منتج جديد</button><button class="b g" onclick="publish()">نشر التعديلات للمتجر</button></div>
 <div class="pl">${PR.map(p=>`<div class="card"><img src="${esc(p.colors[0]?.images[0]||'img/logo.svg')}" alt="" style="${p.colors.some(c=>!c.images.length)?'outline:3px solid var(--a)':''}"><b>${esc(p.name)}</b> ${p.hidden?'<span class="st">مخفي</span>':''}<br><small>${p.price} ج · ${p.colors.length} ألوان · المخزون ${tot(p)}</small>
 <div class="bar" style="margin:8px 0 0"><button class="b s" onclick="edit(${p.id})">تعديل</button><button class="b r" onclick="rm(${p.id})">حذف</button></div></div>`).join('')||'<p style="color:var(--m)">لا توجد منتجات. أضف أول منتج.</p>'}</div>`}
async function rm(id){if(!confirm('حذف المنتج؟'))return;await del('products',id);PR=PR.filter(p=>p.id!==id);rProducts()}
function edit(id){
 ed=id?JSON.parse(JSON.stringify(PR.find(p=>p.id===id))):{id:Date.now(),name:'',cat:'أطفال',desc:'',price:0,old:0,sold:0,hidden:false,sizes:[],colors:[]};
 renderForm();$('mod').classList.add('on')}
function renderForm(){
 $('mb').innerHTML=`<h2 style="margin-bottom:8px">${PR.find(p=>p.id===ed.id)?'تعديل منتج':'منتج جديد'}</h2>
 <label>اسم المنتج</label><input value="${esc(ed.name)}" oninput="ed.name=this.value">
 <div class="g2"><div><label>القسم</label><input value="${esc(ed.cat)}" oninput="ed.cat=this.value"></div><div><label>عدد المبيعات المعروض</label><input type="number" value="${ed.sold}" oninput="ed.sold=+this.value"></div>
 <div><label>السعر (ج)</label><input type="number" value="${ed.price}" oninput="ed.price=+this.value"></div><div><label>السعر قبل الخصم</label><input type="number" value="${ed.old}" oninput="ed.old=+this.value"></div></div>
 <label>الوصف</label><textarea rows="2" oninput="ed.desc=this.value">${esc(ed.desc)}</textarea>
 <label>المقاسات المتاحة (اكتب المقاس ثم اضغط إضافة، ويمكن إدخال عدة مقاسات بفاصلة)</label>
 <div class="bar" style="margin:4px 0">${ed.sizes.map((s,k)=>`<span class="st" style="font-size:14px;padding:3px 12px">${esc(s)} <button onclick="rmSize(${k})" style="background:none;color:#B23A55;font-size:16px" aria-label="حذف المقاس">×</button></span>`).join('')||'<small style="color:var(--m)">لم تُضف مقاسات بعد</small>'}</div>
 <div class="bar" style="margin:0"><input id="ns" placeholder="مثال: 34-35 أو XL أو 40" style="width:210px" onkeydown="if(event.key==='Enter'){event.preventDefault();addSize()}"><button class="b s" onclick="addSize()">+ إضافة مقاس</button><button class="b s" onclick="presetSizes(['26-27','28-29','30-31','32-33'])">قالب أطفال</button><button class="b s" onclick="presetSizes(['36-37','38-39','40-41'])">قالب كبار</button></div>
 <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" ${ed.hidden?'checked':''} onchange="ed.hidden=this.checked"> إخفاء المنتج عن المتجر</label>
 <h3 style="margin-top:14px">الألوان والصور والكميات</h3>
 ${ed.colors.map((c,i)=>`<div class="cr"><div class="top"><div><label>اسم اللون</label><input value="${esc(c.name)}" oninput="ed.colors[${i}].name=this.value"></div><input type="color" value="${esc(c.hex)}" oninput="ed.colors[${i}].hex=this.value"><button class="b r" onclick="ed.colors.splice(${i},1);renderForm()">حذف</button></div>
 <div class="im">${c.images.map((u,j)=>`<div><img src="${esc(u)}" alt=""><button onclick="ed.colors[${i}].images.splice(${j},1);renderForm()" aria-label="حذف الصورة">×</button></div>`).join('')}</div>
 <label class="b s" style="margin:0">+ رفع صور<input type="file" accept="image/*" multiple hidden onchange="upl(${i},this)"></label>
 <label>الكمية المتاحة لكل مقاس</label><div class="stk">${ed.sizes.map((s,k)=>`<div><label>${esc(s)}</label><input type="number" min="0" value="${c.stock[k]||0}" oninput="ed.colors[${i}].stock[${k}]=+this.value"></div>`).join('')}<div style="width:130px"><label>+ مقاس جديد</label><input placeholder="اكتب ثم Enter" onkeydown="if(event.key==='Enter'){event.preventDefault();addSizeIn(this)}" onchange="addSizeIn(this)"></div></div></div>`).join('')}
 <button class="b s" onclick="ed.colors.push({name:'',hex:'#cccccc',images:[],stock:ed.sizes.map(()=>0)});renderForm()">+ إضافة لون</button>
 <div class="bar" style="margin-top:16px"><button class="b" onclick="saveP()">حفظ</button><button class="b s" onclick="$('mod').classList.remove('on')">إلغاء</button></div>`}
function addSize(v){const inp=$('ns');v=typeof v==='string'?v:inp.value;v.split(/[,،]/).map(s=>s.trim()).filter(Boolean).forEach(s=>{if(!ed.sizes.includes(s)){ed.sizes.push(s);ed.colors.forEach(c=>c.stock.push(0))}});renderForm();setTimeout(()=>{const n=$('ns');n&&n.focus()},0)}
function addSizeIn(inp){if(inp.value.trim())addSize(inp.value)}
function rmSize(k){ed.sizes.splice(k,1);ed.colors.forEach(c=>c.stock.splice(k,1));renderForm()}
function presetSizes(L){ed.sizes=[...L];ed.colors.forEach(c=>{c.stock=L.map((_,k)=>c.stock[k]||0)});renderForm()}
async function saveP(){
 if(!ed.name.trim()||ed.price<=0||!ed.colors.length||!ed.sizes.length)return toast('أدخل الاسم والسعر ومقاساً ولوناً واحداً على الأقل');
 if(ed.colors.some(c=>!c.name.trim()))return toast('اكتب اسم كل لون');
 if(ed.colors.some(c=>!c.images.length)&&!confirm('بعض الألوان بلا صور، وسيظهر شعار المتجر بدلها. هل تريد الحفظ؟'))return;
 await put('products',ed);PR=(await all('products'));$('mod').classList.remove('on');rProducts();toast('تم الحفظ محلياً. اضغط "نشر" ليظهر في المتجر')}
/* ضغط الصورة ثم رفعها: Cloudinary إن ضُبط، وإلا إلى Google Drive عبر الخادم، وإلا تبقى محلية */
const shrink=f=>new Promise(res=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};i.src=r.result};r.readAsDataURL(f)});
let lastErr='';
async function hosted(d){
 if(CF.cloud&&CF.preset){try{const fd=new FormData();fd.append('file',d);fd.append('upload_preset',CF.preset);const r=await(await fetch(`https://api.cloudinary.com/v1_1/${CF.cloud}/image/upload`,{method:'POST',body:fd})).json();if(r.secure_url)return r.secure_url;lastErr=(r.error&&r.error.message)||'خطأ Cloudinary'}catch(e){lastErr='تعذّر الوصول إلى Cloudinary'}}
 if(CF.api&&CF.key){const r=await api('adminUpload',{data:d.split(',')[1]});if(r.ok)return r.url;lastErr=r.error}
 else if(!lastErr)lastErr='اضبط رابط الخادم ومفتاح الأدمن';
 return null}
async function upl(i,inp){
 toast('جارٍ رفع الصور...');let bad=0;
 for(const f of inp.files){const d=await shrink(f),u=await hosted(d);if(!u)bad++;ed.colors[i].images.push(u||d)}
 renderForm();if(bad)toast('حُفظت '+bad+' صورة محلياً فقط: '+lastErr)}
async function publish(){
 if(!CF.api){try{localStorage.setItem('dafi_products',JSON.stringify(PR.filter(p=>!p.hidden)));return toast('نُشرت تجريبياً على نفس الموقع. اضبط رابط الخادم للنشر الحقيقي')}catch(e){return toast('الصور كبيرة على التخزين المحلي، اضبط Cloudinary والخادم')}}
 if(PR.some(p=>p.colors.some(c=>c.images.some(u=>u.startsWith('data:'))))){
  toast('جارٍ رفع الصور المحلية...');let bad=0;lastErr='';
  for(const p of PR)for(const c of p.colors)for(let n=0;n<c.images.length;n++)if(c.images[n].startsWith('data:')){const u=await hosted(c.images[n]);if(u)c.images[n]=u;else bad++}
  for(const p of PR)await put('products',p);
  if(bad)return toast('فشل رفع '+bad+' صورة: '+lastErr)}
 const r=await api('adminPublish',{products:PR.map(p=>({id:p.id,name:p.name,cat:p.cat,desc:p.desc,price:p.price,old:p.old,sold:p.sold,hidden:!!p.hidden,sizes:p.sizes.join('|'),colors:JSON.stringify(p.colors)}))});
 toast(r.ok?'تم النشر، المنتجات ظاهرة الآن في المتجر':r.error||'فشل النشر')}

 $('main').innerHTML=`<div class="card" style="max-width:560px">${f('api','رابط Apps Script (ينتهي بـ /exec)')}${f('key','مفتاح الأدمن (نفس ADMIN_KEY)')}${f('cloud','Cloudinary Cloud name')}${f('preset','Cloudinary Upload preset (Unsigned)')}${f('wa','رقم واتساب بصيغة دولية')}
 <button class="b" style="margin-top:14px" onclick="put('settings',CF).then(()=>{toast('تم الحفظ');if(CF.api)sync(true)})">حفظ الإعدادات</button> <button class="b s" style="margin-top:14px" onclick="ping()">اختبار الاتصال</button>
 <p style="color:var(--m);font-size:13px;margin-top:12px">بياناتك محفوظة في متصفح هذا الجهاز فقط. خذ نسخة احتياطية أسبوعياً من صفحة الطلبات.</p></div>`}
async function backup(){const d={products:PR,orders:OR,settings:CF};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(d)],{type:'application/json'}));a.download='dafi-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()}
async function restore(inp){const d=JSON.parse(await inp.files[0].text());for(const p of d.products||[])await put('products',p);for(const o of d.orders||[])await put('orders',o);if(d.settings)await put('settings',d.settings);toast('تمت الاستعادة');init()}
init();
</script>
